<!-- ============================================================
     TASKFLOW — MINIMAL TASK MANAGER
     File: index.html
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c2410c" />
  <meta name="description" content="TaskFlow — a fast, offline-first task manager." />
  <title>TaskFlow — Minimal Task Manager</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="app" role="main">

    <!-- HEADER -->
    <header class="app-header">
      <div class="app-title-block">
        <h1 class="app-title">Task<span class="accent">Flow</span></h1>
        <p class="app-tagline">Offline-first task manager</p>
      </div>

      <button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>
    </header>

    <!-- ONBOARDING HINT -->
    <div id="onboardingHint" class="onboarding-hint" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
      <span>Tap <strong>📅</strong> for a due date and <strong>🚩</strong> for priority. Everything saves offline!</span>
    </div>

    <!-- ADD TASK FORM -->
    <form class="add-form" id="addForm" autocomplete="off">
      <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done?" maxlength="200" aria-label="New task title" />
      
      <!-- Hidden native date input -->
      <input type="date" id="taskDate" class="task-date-hidden" aria-label="Due date (optional)" />
      
      <!-- Calendar button -->
      <button type="button" id="dateBtn" class="icon-action-btn" aria-label="Pick a due date" title="Set a due date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
      </button>

      <!-- Priority button -->
      <button type="button" id="priorityBtn" class="icon-action-btn" aria-label="Set priority" title="Priority: Low">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
          <line x1="4" y1="22" x2="4" y2="15" />
        </svg>
      </button>

      <!-- Add button -->
      <button type="submit" id="addBtn" class="add-btn" aria-label="Add task" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span class="add-btn-text">Add</span>
      </button>
    </form>

    <!-- FILTER TABS -->
    <nav class="filters" aria-label="Filter tasks">
      <div class="filter-tabs" role="tablist">
        <button class="filter-tab is-active" type="button" role="tab" data-filter="all" aria-selected="true">All</button>
        <button class="filter-tab" type="button" role="tab" data-filter="active" aria-selected="false">Active</button>
        <button class="filter-tab" type="button" role="tab" data-filter="completed" aria-selected="false">Completed</button>
      </div>
    </nav>

    <!-- TASK LIST -->
    <section class="task-section" aria-label="Tasks">
      <ul class="task-list" id="taskList" role="list"></ul>

      <div class="empty-state" id="emptyState" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
        <p class="empty-title" id="emptyTitle">No tasks yet</p>
        <p class="empty-sub" id="emptySub">Add your first task above to get started.</p>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="app-footer" id="appFooter" hidden>
      <span class="items-left" id="itemsLeft" aria-live="polite">
        <span id="itemsLeftCount">0</span>
        <span id="itemsLeftLabel">items left</span>
      </span>

      <button class="clear-btn" type="button" id="clearCompleted" aria-label="Clear completed tasks">
        Clear completed
      </button>
    </footer>

  </main>

  <!-- Install Prompt Banner -->
  <div id="installBanner" class="install-banner" hidden>
    <div class="install-content">
      <img src="icon-192.png" alt="TaskFlow Icon" class="install-icon">
      <div class="install-text">
        <strong>Install TaskFlow</strong>
        <span>Works offline. Fast & lightweight.</span>
      </div>
    </div>
    <div class="install-actions">
      <button id="installCancel" class="install-cancel">Not now</button>
      <button id="installConfirm" class="install-confirm">Install</button>
    </div>
  </div>

  <!-- Portfolio Credit -->
  <footer class="credit">
    Built by <a href="https://mustaphyambal-maker.github.io/portfolio/" target="_blank">Mustapha Ambali</a>
  </footer>

  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
